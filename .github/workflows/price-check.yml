name: Mokab Price Check

on:
  schedule:
    # 6:00 صباحاً بتوقيت السعودية (UTC+3) = 3:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Run price check
        id: check
        run: python check_prices.py

      - name: Commit updated baseline
        run: |
          git config user.name "mokab-price-bot"
          git config user.email "actions@github.com"
          git add mokab_price_baseline.json
          if git diff --cached --quiet; then
            echo "لا تغييرات في baseline — لا حاجة للـ commit."
            exit 0
          fi
          git commit -m "تحديث أسعار مكعب - $(date -u +%Y-%m-%d)"
          # قد يكون main تقدّم أثناء تشغيل السكربت (فحص الأسعار يأخذ دقائق) —
          # نعيد المحاولة مع rebase على أحدث main بدل ما نفشل بـ non-fast-forward.
          success=false
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                success=true
                break
              fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          if [ "$success" != "true" ]; then
            echo "فشل دفع baseline بعد عدة محاولات." >&2
            exit 1
          fi

      - name: Open issue if prices changed
        if: hashFiles('issue_body.md') != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔔 تغيّرات أسعار مكعب - ${{ github.run_id }}"
          content-filepath: issue_body.md
          labels: price-alert
